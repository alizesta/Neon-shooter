name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q NeonShooter_*.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Fix SurfaceView draw name clash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path("NeonShooter/app/src/main/java/com/claude/neonshooter/GameView.kt")
          text = source.read_text(encoding="utf-8")
          text, replacements = re.subn(r"(?<![\\w.])draw(?=\\s*\\()", "renderGameFrame", text)
          if replacements == 0:
              raise SystemExit("Expected unqualified draw() method or call was not found")
          source.write_text(text, encoding="utf-8")
          print(f"Renamed {replacements} unqualified draw() occurrence(s)")
          PY
      - run: cd NeonShooter && gradle assembleDebug --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          files: NeonShooter/app/build/outputs/apk/debug/app-debug.apk
