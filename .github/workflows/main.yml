name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android project
        run: unzip -q NeonShooter_*.zip
      - name: Apply gameplay and visual update
        run: python3 patch_game.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: cd NeonShooter && gradle assembleDebug --no-daemon
      - name: Publish updated APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gameplay-v2
          name: Neon Shooter - Gameplay Update
          files: NeonShooter/app/build/outputs/apk/debug/app-debug.apk
