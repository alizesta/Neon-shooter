name: Build Neon Shooter 2.6.2 • ship progression

on:
  push:
    paths:
      - '.github/workflows/main.yml'
      - 'build-assets/v24/source.part*'
      - 'source-inspection/GameView.kt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore the complete v2.4.1 Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/neon-v24"
          cat build-assets/v24/source.part* > "$RUNNER_TEMP/neon-v24/project.b64"
          base64 --decode "$RUNNER_TEMP/neon-v24/project.b64" > "$RUNNER_TEMP/neon-v24/project.zip"
          echo "37349d4a8b0a5743b942cc129c7a1209fb839108ab3f2c16c0215a814d81f310  $RUNNER_TEMP/neon-v24/project.zip" | sha256sum --check -
          rm -rf NeonShooter
          unzip -q "$RUNNER_TEMP/neon-v24/project.zip" -d .
          test -s NeonShooter/app/src/main/java/com/claude/neonshooter/GameView.kt
          test -s NeonShooter/app/build.gradle.kts
          test -s NeonShooter/app/src/main/java/com/claude/neonshooter/GameView.kt



      - name: Apply 2.4.1 menu, upgrade and coin fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("NeonShooter/app/src/main/java/com/claude/neonshooter/GameView.kt")
          source = p.read_text(encoding="utf-8")
          patches = [
              ("        if (id.startsWith(\"upgrade_\")) {\n            val i = id.substringAfter('_').toIntOrNull() ?: 0\n            upgradeChoices.getOrNull(i)?.let { drawAbilityIcon(c, it, cx, cy) }\n            return\n        }", "        if (id.startsWith(\"upgrade_\")) {\n            // The ability is already shown on its card; this button means choose/download.\n            c.drawLine(x, y - 8f * s, x, y + 3f * s, paint)\n            c.drawLine(x, y + 3f * s, x - 4.5f * s, y - 1.5f * s, paint)\n            c.drawLine(x, y + 3f * s, x + 4.5f * s, y - 1.5f * s, paint)\n            c.drawLine(x - 8f * s, y + 7f * s, x + 8f * s, y + 7f * s, paint)\n            paint.style = Paint.Style.FILL\n            return\n        }", "download icon on upgrade button"),
              ("            drawButtonIcon(c, b.id, (r.left+r.right)/2f, r.top + 11f)", "            if (st == St.MENU) {\n                val cy = (r.top + r.bottom) / 2f\n                drawButtonIcon(c, b.id, r.left + 18f, cy)\n                drawFittedText(c, b.label, (r.left + r.right) / 2f + 10f, cy + 2.1f, 6.1f, 0xFFEAFBFF.toInt(), 82f)\n            } else {\n                drawButtonIcon(c, b.id, (r.left+r.right)/2f, r.top + 11f)\n            }", "text labels beside main-menu icons"),
              ("        val scale = s * (1f + sin(item.age * 5f) * 0.06f)", "        val coinScale = if (item.type == 13) 0.66f else 1f\n        val scale = s * coinScale * (1f + sin(item.age * 5f) * 0.06f)", "smaller coin rendering"),
              ("                13 -> { credits += item.amount.coerceAtLeast(1); score += item.amount * 2; prefs.edit().putInt(\"credits\", credits).apply(); bannerT = 0.45f }", "                13 -> { credits += item.amount.coerceAtLeast(1); score += item.amount * 2; prefs.edit().putInt(\"credits\", credits).apply() }", "coin pickup no longer triggers stage banner"),
          ]
          for old, new, label in patches:
              matches = source.count(old)
              if matches != 1:
                  raise SystemExit(f"{label}: expected one match, found {matches}")
              source = source.replace(old, new, 1)
              print("PATCH " + label)
          p.write_text(source, encoding="utf-8")
          gp = Path("NeonShooter/app/build.gradle.kts")
          gradle = gp.read_text(encoding="utf-8")
          if gradle.count("versionCode = 24") != 1 or gradle.count('versionName = "2.4.0"') != 1:
              raise SystemExit("Unexpected source Gradle version markers")
          gradle = gradle.replace("versionCode = 24", "versionCode = 25", 1)
          gradle = gradle.replace('versionName = "2.4.0"', 'versionName = "2.4.1"', 1)
          gp.write_text(gradle, encoding="utf-8")
          print("PATCH app version 2.4.1")
          PY
      - name: Apply full ship progression gameplay source
        shell: bash
        run: |
          set -euo pipefail
          cp source-inspection/GameView.kt NeonShooter/app/src/main/java/com/claude/neonshooter/GameView.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path("NeonShooter/app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")
          if s.count("versionCode = 25") != 1 or s.count('versionName = "2.4.1"') != 1:
              raise SystemExit("Unexpected base version before v2.6.2")
          s = s.replace("versionCode = 25", "versionCode = 29", 1)
          s = s.replace('versionName = "2.4.1"', 'versionName = "2.6.2"', 1)
          p.write_text(s, encoding="utf-8")
          print("PATCH full gameplay source and version 2.6.2")
          PY

      - name: Generate original cinematic background music
        run: python3 NeonShooter/tools/generate_ambient.py

      - name: Verify requested gameplay features before compiling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          game = Path("NeonShooter/app/src/main/java/com/claude/neonshooter/GameView.kt").read_text(encoding="utf-8")
          gradle = Path("NeonShooter/app/build.gradle.kts").read_text(encoding="utf-8")
          checks = {
              "maxed level-5 abilities are filtered, not deleted": "abilityRank(id) < 5" in game and "selectedAbilities.toList()" in game,
              "pause shows the acquired ability list": "قابلیت‌های فعال" in game and "selectedAbilities.toList()" in game,
              "enemies and bosses drop real coins": "items.add(Item(e.x, e.y, 13," in game and "13 -> { credits += item.amount" in game,
              "magnet pulls pickups and coins": "magnetTimer > 0f || magnetLevel > 0" in game,
              "bosses inherit two random owned skills": "return owned.shuffled().take(2)" in game and "bossSkills = chooseBossSkills()" in game,
              "black hole distorts the star background": "val bend = ((reach - d) / reach)" in game and "hole.spin" in game,
              "five distinct ships are implemented": "coerceIn(0, 4)" in game and '4 -> "ققنوس"' in game,
              "buttons use icon drawing": "drawButtonIcon(c, b.id" in game and "text(c, b.label" not in game,
              "about page and Telegram link exist": "درباره نئون شوتر" in game and "https://t.me/gateneon" in game,
              "background music player is wired": "MediaPlayer.create(act, R.raw.ambient_theme, attributes, 0)" in game,
              "five ships have coin-purchased ownership": "private fun shipPrice(id: Int)" in game and "private fun buyOrSelectShip" in game and "ship_buy_4" in game,
              "ship selection persists and changes actual ship artwork": "putInt(\"ship\", currentShip)" in game and "drawPlayerShip(c, px, py)" in game and "drawPlayerShip(c, cx, cy, shipId)" in game,
              "bosses grant a separate persistent upgrade currency": "upgradePoints += earned" in game and "ship_upgrade_points" in game,
              "per-ship upgrades affect attack, armor, mobility, hull and golden ability": all(x in game for x in ["shipUpgradeRank(\"attack\")", "shipUpgradeRank(\"armor\")", "shipUpgradeRank(\"mobility\")", "shipUpgradeRank(\"hull\")", "shipUpgradeRank(\"gold\")"]),
              "hangar and upgrade workshop have interactive screens": "drawShipHangar(c)" in game and "drawShipUpgrades(c)" in game and "St.SHIP_UPGRADE" in game,
              "upgrade action uses a download icon": "c.drawLine(x, y - 8f * s, x, y + 3f * s, paint)" in game,
              "main menu shows text beside icons": 'drawFittedText(c, b.label' in game and 'if (st == St.MENU)' in game,
              "coin visuals are smaller": 'if (item.type == 13) 0.66f else 1f' in game,
              "coin pickup does not trigger stage banner": '13 -> { credits += item.amount.coerceAtLeast(1); score += item.amount * 2; prefs.edit().putInt("credits", credits).apply() }' in game,
              "music state is synced when pausing": "st = St.PAUSE\n                            syncMusic()" in game,
              "ability combo registry is active": "private fun activeCombo()" in game and "val combo = activeCombo()" in game,
              "drone missile swarm gains count, damage and homing": "val swarmCombo" in game and "if (swarmCombo) 1 else 0" in game and "val homingSpeed = if (droneLevel > 0 && missileLevel > 0) 215f else 175f" in game,
              "prism laser and scanner synergy improve beam damage": "val prismCombo" in game and "if (prismCombo) 1.22f else 1f" in game and "scannerRank * 2" in game,
              "magnetic shield increases interception radius and capacity": "val magneticShieldRadius = if (magnetLevel > 0 && shieldLevel > 0) 34f else 27f" in game and "shieldMaxHp += 4" in game,
              "gravity EMP combo damages and slows enemies": "enemySlowTimer = max(enemySlowTimer, 1.4f + empRank * 0.25f)" in game and "target.hp -= empRank * 2" in game,
              "chain explosive combo creates splash damage": "splash.hp -= explosiveRank" in game and "ImpactRing(next.x, next.y, 0.30f, 0.30f)" in game,
              "phase-three bosses summon reinforcements": "e.phaseSummonTimer -= enemyDt" in game and "summonedEnemies.add(E(sx, e.y + 12f, 6" in game,
              "boss phases have distinct visual rings": "if (e.type == 2 && e.phase >= 2)" in game and "0xFFFF65C8.toInt()" in game,
              "release version is 2.6.2": "versionCode = 29" in gradle and 'versionName = "2.6.2"' in gradle,
              "legendary ship abilities include descriptions after boss milestone rewards": "private fun legendaryDescription()" in game and "drawWrappedCardText(c, legendaryDescription()" in game and "wave in 10..50 && wave % 10 == 0" in game,
              "first 50 waves have distinct astronomical stage names": "private val stageNames = arrayOf(" in game and "private fun waveTitle(level: Int = wave)" in game and "stageNames.getOrElse(level - 1)" in game,
              "every upgrade ability has its own icon case": "private fun drawAbilityIcon" in game,

              "music uses game audio attributes and starts the media player": "AudioAttributes.CONTENT_TYPE_MUSIC" in game and "MediaPlayer.create(act, R.raw.ambient_theme, attributes, 0)" in game and "player.start()" in game,
              "music initialization can retry after a failed resource load": "musicPrepared = false" in game and "Background music resource could not be opened" in game,
              "sound toggle is available in pause and persists": '"sound" to if (sfx.enabled)' in game and 'putBoolean("sound_enabled", sfx.enabled)' in game,
              "coin balance appears in menu and gameplay HUD": "drawCoinCounter(c, 177f" in game and "drawCoinCounter(c, 164f" in game,
              "ship glow follows the silhouette instead of a circular disk": "BlurMaskFilter(7.5f" in game and "silhouette.addPath(body)" in game and "c.drawCircle(0f, 1f, 17f, paint)" not in game,
              "hangar ship icons are scaled to fit their tabs": "c.scale(0.42f, 0.42f, x, y)" in game,
              "upgrade headline and card labels are centered and separated from level text": 'text(c, "یک قابلیت را انتخاب کن"' in game and "drawFittedText(c, upgradeTitle(id), cx" in game and 'drawFittedText(c, "LVL "' in game,
              "wave progress resets for every new wave": "private fun spawnWave() {\n        wave++\n        waveKills = 0" in game,
          }
          ability_ids = ["drone", "missile", "laser", "firepower", "magnet", "shield", "dash", "chain", "hull", "emp", "ricochet", "gravity_well", "overload", "nanobots", "scanner", "salvage_drone", "kill_streak", "ricochet_shield", "health_regen", "armor", "critical", "overdrive", "explosive", "piercing", "stasis", "scavenger", "multishot", "phoenix"]
          icon_start = game.index("private fun drawAbilityIcon")
          icon_end = game.index("private fun drawFittedText", icon_start)
          icon_source = game[icon_start:icon_end]
          icon_counts = {item: icon_source.count('"' + item + '" ->') for item in ability_ids}
          if any(count != 1 for count in icon_counts.values()):
              failed_icon_ids = [item for item, count in icon_counts.items() if count != 1]
              raise SystemExit("Ability icon cases missing or duplicated: " + ", ".join(failed_icon_ids))
          print(f"PASS {len(ability_ids)} abilities each have a dedicated icon case")
          stage_start = game.index("private val stageNames = arrayOf(")
          stage_end = game.index(")", stage_start)
          stage_names = re.findall(r'"([^"]+)"', game[stage_start:stage_end])
          if len(stage_names) != 50 or len(set(stage_names)) != 50:
              raise SystemExit(f"Expected 50 unique stage names, found {len(stage_names)}")
          print("PASS 50 distinct astronomical stage names")
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(("PASS " if ok else "FAIL ") + name)
          audio = Path("NeonShooter/app/src/main/res/raw/ambient_theme.wav")
          if not audio.is_file() or audio.stat().st_size < 1_000_000:
              failed.append("generated background music asset is missing or too small")
          else:
              print(f"PASS generated soundtrack ({audio.stat().st_size} bytes)")
          if failed:
              raise SystemExit("Feature verification failed: " + "; ".join(failed))
          PY

      - name: Package complete Android project
        run: zip -qr NeonShooter-Android-Project-v2.6.2.zip NeonShooter

      - name: Upload Android project artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonShooter-Android-Project-v2.6.2
          path: NeonShooter-Android-Project-v2.6.2.zip
          if-no-files-found: error
          retention-days: 30

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Configure persistent release signing
        env:
          KEYSTORE_B64: ${{ secrets.NEON_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "NEON_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/neon-shooter-release.jks"
          test -s "$RUNNER_TEMP/neon-shooter-release.jks"

      - name: Build signed release APK
        env:
          NEON_KEYSTORE_PATH: ${{ runner.temp }}/neon-shooter-release.jks
          NEON_KEYSTORE_PASSWORD: ${{ secrets.NEON_KEYSTORE_PASSWORD }}
          NEON_KEY_ALIAS: ${{ secrets.NEON_KEY_ALIAS }}
          NEON_KEY_PASSWORD: ${{ secrets.NEON_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          cd NeonShooter
          test -f "$NEON_KEYSTORE_PATH"
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Neon-Shooter.apk
          test -s app/build/outputs/apk/release/Neon-Shooter.apk
          APK="$PWD/app/build/outputs/apk/release/Neon-Shooter.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK"
          stat -c 'APK_SIZE_BYTES=%s' "$APK"

      - name: Record verified v2.6.2 APK build
        shell: bash
        run: |
          set -euo pipefail
          APK="NeonShooter/app/build/outputs/apk/release/Neon-Shooter.apk"
          cat > release-proof-v2.6.2.txt <<EOF
          run_id=${GITHUB_RUN_ID}
          source_commit=${GITHUB_SHA}
          app_version=2.6.2
          apk_sha256=$(sha256sum "$APK" | cut -d " " -f 1)
          apk_size_bytes=$(stat -c "%s" "$APK")
          signature=verified-by-apksigner
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-proof-v2.6.2.txt
          git commit -m "build: record verified v2.6.2 APK metadata"
          git push origin HEAD:main
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Shooter-v2.6.2-APK
          path: NeonShooter/app/build/outputs/apk/release/Neon-Shooter.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Neon Shooter 2.6.2
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.6.2
          name: Neon Shooter v2.6.2
          body: |
            Actual gameplay update:
            - Five distinct playable ships with separate silhouettes, persistent selection, and coin-based unlocking.
            - Ship prices: 450, 900, 1,550 and 2,400 coins; the starter ship is free.
            - Bosses award a separate permanent-upgrade currency: 2 points per boss, 4 at waves 25, 50, etc.
            - Each ship has its own persistent upgrade tree: weapon power, armor, mobility, hull and golden ability.
            - Level-5 abilities remain active and are excluded from future upgrade choices.
            - Pause screen displays the acquired ability list and ranks.
            - Enemies and bosses drop collectible coins; magnet and scavenger abilities collect/increase them.
            - Original 48-second cinematic ambient soundtrack, looped in game.
            - Bosses randomly inherit two abilities owned by the player.
            - Black holes bend and pull the starfield and nearby entities.
            - Five ships with distinct golden abilities.
            - Six real ability synergies: missile-drone swarm, prism laser, magnetic shield, gravity EMP, explosive chain lightning, and scanner laser.
            - Boss phase three calls in elite reinforcements; phase transitions gain distinct neon rings and intensified attack patterns.
            - Pause now includes a persistent sound toggle; the ambient soundtrack retries failed initialization and uses game-music audio attributes.
            - Upgrade text is centered with separate level labels; ship aura follows its silhouette and hangar icons are resized.
            - Coin balance is visible in both the main menu and gameplay HUD; wave progress resets at every new wave.
            - Twenty-eight ability upgrades now have separate custom icons and distinct colors.
            - The first 50 waves use unique planetary, stellar, nebula and galaxy names.
            - Golden ship abilities show their effect descriptions after milestone boss rewards.
            - Icon-only action buttons, Persian About page, and Telegram channel link.
          files: NeonShooter/app/build/outputs/apk/release/Neon-Shooter.apk
          fail_on_unmatched_files: true
