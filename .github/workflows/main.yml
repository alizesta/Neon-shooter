name: Build Neon Shooter 2.3.0
on:
  push:
    paths:
      - 'NeonShooter_*.zip'
      - 'patch_game*.py'
      - 'patch_game_v211.py.xz'
      - 'patch_game_v22.py.xz'
      - 'patch_progression_17.part*'
      - 'SPRITES_V5_DUMP.kt'
      - 'build-assets/v23/patch_game_v23.part*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android project
        run: rm -rf NeonShooter && unzip -oq NeonShooter_*.zip
      - name: Apply 2D art and gameplay refinement
        run: python3 patch_game_v3.py
      - name: Add progression, ships, bosses and dynamic events
        run: python3 patch_game_features.py
      - name: Apply gameplay polish and stackable upgrade system
        run: python3 patch_game_polish.py
      - name: Apply 1.6 glass UI, shield health and reserved ad slots
        run: python3 patch_game_next.py
      - name: Apply Pixelfx-inspired native Android visual effects
        run: python3 patch_game_pixelfx.py
      - name: Apply Neon Shooter 1.7 progression, extra health and ship legendaries
        run: |
          cat patch_progression_17.part01 patch_progression_17.part02 patch_progression_17.part03 patch_progression_17.part04 > patch_game_progression.py
          python3 patch_game_progression.py
      - name: Apply Neon Shooter 1.8 health HUD, upgrade cards and EMP ability
        run: python3 patch_game_v18.py
      - name: Apply Neon Shooter 1.9 abilities and PixelFX visual effects
        run: python3 patch_game_v19.py
      - name: Apply Neon Shooter 2.0 cleanup, local settings and Google removal
        run: python3 patch_game_v20.py
      - name: Apply Tapsell Plus monetization and Neon Shooter 2.1.1 metadata
        run: |
          xz -dc patch_game_v211.py.xz > patch_game_v211.py
          python3 patch_game_v211.py
      - name: Apply Neon Shooter 2.2.0 gameplay and Persian localization
        run: |
          xz -dc patch_game_v22.py.xz > patch_game_v22.py
          python3 patch_game_v22.py
      - name: Apply Neon Shooter 2.3.0 rhythm combat and new ships
        run: |
          cat build-assets/v23/patch_game_v23.part01 build-assets/v23/patch_game_v23.part02 build-assets/v23/patch_game_v23.part03 build-assets/v23/patch_game_v23.part04 | base64 -d | xz --ignore-check -dc > patch_game_v23.py
          python3 patch_game_v23.py
      - name: Package complete Android project
        run: zip -qr NeonShooter-Android-Project-v2.3.0.zip NeonShooter
      - name: Upload Android project artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonShooter-Android-Project-v2.3.0
          path: NeonShooter-Android-Project-v2.3.0.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Configure persistent release signing
        env:
          KEYSTORE_B64: ${{ secrets.NEON_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "NEON_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/neon-shooter-release.jks"
          test -s "$RUNNER_TEMP/neon-shooter-release.jks"
      - name: Build signed release APK
        env:
          NEON_KEYSTORE_PATH: ${{ runner.temp }}/neon-shooter-release.jks
          NEON_KEYSTORE_PASSWORD: ${{ secrets.NEON_KEYSTORE_PASSWORD }}
          NEON_KEY_ALIAS: ${{ secrets.NEON_KEY_ALIAS }}
          NEON_KEY_PASSWORD: ${{ secrets.NEON_KEY_PASSWORD }}
        run: |
          cd NeonShooter
          test -f "$NEON_KEYSTORE_PATH"
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Neon-Shooter.apk
          test -s app/build/outputs/apk/release/Neon-Shooter.apk
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Shooter-v2.3.0-APK
          path: NeonShooter/app/build/outputs/apk/release/Neon-Shooter.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish Neon Shooter 2.3.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.0
          name: Neon Shooter v2.3.0 (Rhythm Combat + Five Ships + Persian UI)
          files: NeonShooter/app/build/outputs/apk/release/Neon-Shooter.apk
          fail_on_unmatched_files: true
