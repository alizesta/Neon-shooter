name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android project
        run: unzip -q NeonShooter_*.zip
      - name: Inspect relevant source
        run: |
          find NeonShooter/app/src/main -type f \( -name '*.kt' -o -name '*.xml' \) | sort
          for f in $(find NeonShooter/app/src/main -type f -name '*.kt' | sort); do
            echo "===== $f ====="
            cat "$f"
          done
