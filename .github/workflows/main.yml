name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android project
        run: rm -rf NeonShooter && unzip -oq NeonShooter_*.zip
      - name: Apply 2D art and gameplay refinement
        run: python3 patch_game_v3.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: cd NeonShooter && gradle assembleDebug --no-daemon
      - name: Publish refined APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gameplay-v4
          name: Neon Shooter - Gameplay & Flat Art V4
          files: NeonShooter/app/build/outputs/apk/debug/app-debug.apk
