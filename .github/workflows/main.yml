name: Inspect Game Source
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q NeonShooter_*.zip
      - name: Print source files
        run: |
          echo "=== SOURCE TREE ==="
          find NeonShooter/app/src/main -type f | sort
          echo "=== KOTLIN SOURCE ==="
          while IFS= read -r file; do
            echo "===== $file ====="
            cat "$file"
          done < <(find NeonShooter/app/src/main -type f -name '*.kt' | sort)
