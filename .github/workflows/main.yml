name: Build Neon Shooter 2.4.0

on:
  push:
    paths:
      - '.github/workflows/main.yml'
      - 'build-assets/v24/source.part*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore the complete v2.4.0 Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/neon-v24"
          cat build-assets/v24/source.part* > "$RUNNER_TEMP/neon-v24/project.b64"
          base64 --decode "$RUNNER_TEMP/neon-v24/project.b64" > "$RUNNER_TEMP/neon-v24/project.zip"
          echo "37349d4a8b0a5743b942cc129c7a1209fb839108ab3f2c16c0215a814d81f310  $RUNNER_TEMP/neon-v24/project.zip" | sha256sum --check -
          rm -rf NeonShooter
          unzip -q "$RUNNER_TEMP/neon-v24/project.zip" -d .
          test -s NeonShooter/app/src/main/java/com/claude/neonshooter/GameView.kt
          test -s NeonShooter/app/build.gradle.kts

      - name: Generate original cinematic background music
        run: python3 NeonShooter/tools/generate_ambient.py

      - name: Verify requested gameplay features before compiling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          game = Path("NeonShooter/app/src/main/java/com/claude/neonshooter/GameView.kt").read_text(encoding="utf-8")
          gradle = Path("NeonShooter/app/build.gradle.kts").read_text(encoding="utf-8")
          checks = {
              "maxed level-5 abilities are filtered, not deleted": "abilityRank(id) < 5" in game and "selectedAbilities.toList()" in game,
              "pause shows the acquired ability list": "قابلیت‌های فعال" in game and "selectedAbilities.toList()" in game,
              "enemies and bosses drop real coins": "items.add(Item(e.x, e.y, 13," in game and "13 -> { credits += item.amount" in game,
              "magnet pulls pickups and coins": "magnetTimer > 0f || magnetLevel > 0" in game,
              "bosses inherit two random owned skills": "return owned.shuffled().take(2)" in game and "bossSkills = chooseBossSkills()" in game,
              "black hole distorts the star background": "val bend = ((reach - d) / reach)" in game and "hole.spin" in game,
              "five distinct ships are implemented": "currentShip).coerceIn(0, 4)" in game and '4 -> "ققنوس"' in game,
              "buttons use icon drawing": "drawButtonIcon(c, b.id" in game and "text(c, b.label" not in game,
              "about page and Telegram link exist": "درباره نئون شوتر" in game and "https://t.me/gateneon" in game,
              "background music player is wired": "MediaPlayer.create(act, R.raw.ambient_theme)" in game,
              "music state is synced when pausing": "st = St.PAUSE\n                            syncMusic()" in game,
              "release version is 2.4.0": "versionCode = 24" in gradle and 'versionName = "2.4.0"' in gradle,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(("PASS " if ok else "FAIL ") + name)
          audio = Path("NeonShooter/app/src/main/res/raw/ambient_theme.wav")
          if not audio.is_file() or audio.stat().st_size < 1_000_000:
              failed.append("generated background music asset is missing or too small")
          else:
              print(f"PASS generated soundtrack ({audio.stat().st_size} bytes)")
          if failed:
              raise SystemExit("Feature verification failed: " + "; ".join(failed))
          PY

      - name: Package complete Android project
        run: zip -qr NeonShooter-Android-Project-v2.4.0.zip NeonShooter

      - name: Upload Android project artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonShooter-Android-Project-v2.4.0
          path: NeonShooter-Android-Project-v2.4.0.zip
          if-no-files-found: error
          retention-days: 30

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Configure persistent release signing
        env:
          KEYSTORE_B64: ${{ secrets.NEON_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "NEON_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/neon-shooter-release.jks"
          test -s "$RUNNER_TEMP/neon-shooter-release.jks"

      - name: Build signed release APK
        env:
          NEON_KEYSTORE_PATH: ${{ runner.temp }}/neon-shooter-release.jks
          NEON_KEYSTORE_PASSWORD: ${{ secrets.NEON_KEYSTORE_PASSWORD }}
          NEON_KEY_ALIAS: ${{ secrets.NEON_KEY_ALIAS }}
          NEON_KEY_PASSWORD: ${{ secrets.NEON_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          cd NeonShooter
          test -f "$NEON_KEYSTORE_PATH"
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Neon-Shooter.apk
          test -s app/build/outputs/apk/release/Neon-Shooter.apk
          APK="$PWD/app/build/outputs/apk/release/Neon-Shooter.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK"
          stat -c 'APK_SIZE_BYTES=%s' "$APK"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Shooter-v2.4.0-APK
          path: NeonShooter/app/build/outputs/apk/release/Neon-Shooter.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Neon Shooter 2.4.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.0
          name: Neon Shooter v2.4.0
          body: |
            Actual gameplay update:
            - Level-5 abilities remain active and are excluded from future upgrade choices.
            - Pause screen displays the acquired ability list and ranks.
            - Enemies and bosses drop collectible coins; magnet and scavenger abilities collect/increase them.
            - Original 48-second cinematic ambient soundtrack, looped in game.
            - Bosses randomly inherit two abilities owned by the player.
            - Black holes bend and pull the starfield and nearby entities.
            - Five ships with distinct golden abilities.
            - Icon-only action buttons, Persian About page, and Telegram channel link.
          files: NeonShooter/app/build/outputs/apk/release/Neon-Shooter.apk
          fail_on_unmatched_files: true
