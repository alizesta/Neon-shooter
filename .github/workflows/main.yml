name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android project
        run: rm -rf NeonShooter && unzip -oq NeonShooter_*.zip
      - name: Apply 2D art and gameplay refinement
        run: python3 patch_game_v3.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Configure persistent release signing
        env:
          KEYSTORE_B64: ${{ secrets.NEON_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/neon-shooter-release.jks"
          fi
      - name: Build APK
        env:
          NEON_KEYSTORE_PATH: ${{ runner.temp }}/neon-shooter-release.jks
          NEON_KEYSTORE_PASSWORD: ${{ secrets.NEON_KEYSTORE_PASSWORD }}
          NEON_KEY_ALIAS: ${{ secrets.NEON_KEY_ALIAS }}
          NEON_KEY_PASSWORD: ${{ secrets.NEON_KEY_PASSWORD }}
        run: |
          cd NeonShooter
          if [ -f "$NEON_KEYSTORE_PATH" ]; then
            gradle assembleRelease --no-daemon
            mkdir -p app/build/outputs/apk/debug
            cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/debug/app-debug.apk
          else
            gradle assembleDebug --no-daemon
          fi
      - name: Publish refined APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gameplay-v6
          name: Neon Shooter - Pause, HP & Gravity V6
          files: NeonShooter/app/build/outputs/apk/debug/app-debug.apk
